# Mundo "Praga" — protótipo de mapa
# Reproduz exatamente o mesmo mundo: mesma seed + mesmas opções = mesmo mapa.

[world]
name = "praga"
seed = "424242"

[azgaar]
width = 1920            # tamanho do mundo em unidades Azgaar
height = 1080
density = 6             # 1..13 -> 6 = 30K pontos
states = 24             # + "Neutros" = 25 fações iniciais
provinces_ratio = 60    # mais províncias = mais regiões jogáveis
template = "continents"
