# Exemplo de mundo com geografia e política controladas.
# Gerar: python tools/export_azgaar.py worlds/exemplo.toml build/exemplo
#        python tools/build_world.py build/exemplo/world_full.json web/data --config worlds/exemplo.toml

[world]
name = "exemplo"
seed = "ex-aequo-1"

[mundo]
tamanho = "medio"          # pequeno | medio | grande | enorme  (mais células = mais províncias possíveis)

[geografia]
continentes = 3            # 1 a 8, número exato (verificado)
terra = 0.40               # fração do mapa que é terra (±5 pontos)
ilhas = "poucas"           # nenhumas | poucas | muitas
mar_interior = false       # um mar fechado dentro do maior continente

[politica]
reinos = 25                # 25, 50, 75, 100, 125 ou 150
territorio_inicial = 0.30  # fração da terra que começa com dono; o resto são Terras Livres
# províncias por reino: calculadas a partir do tamanho do mapa (ver o relatório depois de gerar)
